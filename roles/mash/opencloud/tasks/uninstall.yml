---
- name: Check existence of OpenCloud systemd service
  ansible.builtin.stat:
    path: "{{ devture_systemd_docker_base_systemd_path }}/{{ opencloud_identifier }}.service"
  register: opencloud_service_stat

- name: Uninstall OpenCloud systemd services and files
  when: opencloud_service_stat.stat.exists | bool
  block:
    - name: Ensure OpenCloud systemd service is stopped
      ansible.builtin.service:
        name: "{{ opencloud_identifier }}"
        state: stopped
        enabled: false
        daemon_reload: true

    - name: Ensure OpenCloud systemd service does not exist
      ansible.builtin.file:
        path: "{{ devture_systemd_docker_base_systemd_path }}/{{ opencloud_identifier }}.service"
        state: absent

    - name: Ensure OpenCloud support files do not exist
      ansible.builtin.file:
        path: "{{ opencloud_base_path }}/{{ item }}"
        state: absent
      with_items:
        - env
        - labels

    - name: Ensure OpenCloud local data path does not exist if empty
      ansible.builtin.command:
        cmd: "rmdir {{ opencloud_data_path }}"
      register: opencloud_data_path_deletion_result
      changed_when: opencloud_data_path_deletion_result.rc == 0
      failed_when: false

    - name: Ensure OpenCloud base path does not exist if empty
      ansible.builtin.command:
        cmd: "rmdir {{ opencloud_base_path }}"
      register: opencloud_base_path_deletion_result
      changed_when: opencloud_base_path_deletion_result.rc == 0
      failed_when: false

    - name: Ensure OpenCloud container network does not exist
      when: opencloud_container_network_deletion_enabled
      block:
        - name: Ensure OpenCloud container network does not exist via community.docker.docker_network
          when: devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
          community.docker.docker_network:
            name: "{{ opencloud_container_network }}"
            state: absent
          register: opencloud_network_deletion_result

        - name: Ensure OpenCloud container network does not exist via ansible.builtin.command
          when: devture_systemd_docker_base_container_network_creation_method == 'command'
          ansible.builtin.command:
            cmd: >-
              {{ devture_systemd_docker_base_host_command_docker }} network rm
              {{ opencloud_container_network }}
          register: opencloud_network_deletion_result
          changed_when: opencloud_container_network in opencloud_network_deletion_result.stdout

- name: Check existence of OpenCloud local data path
  ansible.builtin.stat:
    path: "{{ opencloud_data_path }}"
  register: opencloud_data_path_stat

# We just want to notify the user. Deleting data is too destructive.
- name: Inject the message about the remaining OpenCloud local data path
  when: opencloud_data_path_stat.stat.exists | bool
  ansible.builtin.set_fact:
    devture_playbook_runtime_messages_list: |
      {{
        devture_playbook_runtime_messages_list | default([])
        +
        [
          "Note: As the local OpenCloud instance has been removed, some old data remains in `" + opencloud_data_path + "`. Feel free to delete it."
        ]
      }}

---
- name: Wait for OpenCloud HTTPS status
  ansible.builtin.uri:
    url: "{{ opencloud_url }}/status.php"
    return_content: true
    validate_certs: true
  register: opencloud_status
  until: opencloud_status.status | default(0) == 200
  retries: 20
  delay: 3

- name: Verify OpenCloud status
  ansible.builtin.assert:
    that:
      - opencloud_status.json.installed | bool
      - not opencloud_status.json.maintenance | bool
      - opencloud_status.json.productversion == opencloud_version

- name: Check office WOPI discovery over HTTPS
  ansible.builtin.uri:
    url: "{{ opencloud_collaboration_app_url }}/hosting/discovery"
    return_content: true
    validate_certs: true
  register: opencloud_office_discovery
  until: "opencloud_office_discovery.status | default(0) == 200 and '<wopi-discovery' in opencloud_office_discovery.content | default('')"
  retries: 40
  delay: 3
  when: opencloud_collaboration_enabled | bool

- name: Check Tika from the OpenCloud container network
  ansible.builtin.command:
    argv: >-
      {{ devture_systemd_docker_base_host_command_docker.split() + [
        'exec', opencloud_identifier, 'wget', '-qO-', opencloud_search_tika_url ~ '/version'
      ] }}
  changed_when: false
  when: opencloud_search_enabled | bool
